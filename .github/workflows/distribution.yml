name: GitHub release wheel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build universal wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - name: Build exactly one universal wheel
        run: |
          test "$GITHUB_REF_TYPE" = tag
          SETUPTOOLS_SCM_PRETEND_VERSION="$GITHUB_REF_NAME" uv build --wheel
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = 1
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test "$(basename "$wheel")" = "vcf_sv_stats-${GITHUB_REF_NAME}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: github-release-wheel
          path: dist/*.whl
